{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prefect-server.fullname" . }}-server
  labels:
    {{- include "prefect-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "prefect-server.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- end }}