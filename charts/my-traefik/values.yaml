traefik:
  image:
    tag: v3.7.5
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
      namespaces:
        - default
        - infra

certmanager:
  enabled: false
  choseClusterIssuer: acme # acme or self-signed
  cloudflareApiToken: xxx
  email: xxx@xxx.com

config:
  domain: xxx.com
  https:
    enabled: false
  auth: 
    enabled: true
    username: xxx== # echo -n 'admin' | base64
    password: xxx== # echo -n '123456' | base64